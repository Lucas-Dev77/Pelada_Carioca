name: Atualizar notícias

on:
  schedule:
    # 12:00 UTC = 09:00 de Brasília, todo dia
    - cron: '0 12 * * *'
  workflow_dispatch:        # permite rodar na mão pelo botão da aba Actions

permissions:
  contents: write           # necessário para o robô fazer commit

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar as notícias
        run: node scripts/coletar-noticias.mjs

      - name: Publicar se algo mudou
        run: |
          git config user.name  "robo-pelada"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/noticias.json
          if git diff --staged --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "Atualiza notícias"
            git push
          fi
