<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bola fora — Basquete Carioca</title>
  <meta name="robots" content="noindex">

  <link rel="icon" href="/basquete-carioca/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/basquete-carioca/favicon.png" sizes="96x96">

  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

  <style>
    :root{ --laranja:#ea5a00; --tinta:#2b2b2b; --gelo:#f7f6f4; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      min-height:100vh;
      display:grid; place-items:center;
      padding:40px 24px;
      background:var(--tinta); color:var(--gelo);
      font-family:"Alata", system-ui, sans-serif;
      line-height:1.65; text-align:center;
    }
    .caixa{ max-width:540px; }
    .placar{
      font-family:"Montserrat", system-ui, sans-serif;
      font-weight:300; font-size:clamp(4rem,16vw,8rem);
      line-height:1; letter-spacing:-.04em; color:var(--laranja);
    }
    h1{
      font-family:"Montserrat", system-ui, sans-serif;
      font-weight:300; font-size:clamp(1.5rem,4vw,2.1rem);
      margin:14px 0 16px;
    }
    p{ color:#b3aca3; margin-bottom:34px; }
    a{
      display:inline-block;
      background:var(--laranja); color:#fff;
      font-weight:700; font-size:.95rem;
      padding:13px 28px; border-radius:4px;
      text-decoration:none;
      transition:background .3s ease;
    }
    a:hover{ background:#c94b00; }
    a:focus-visible{ outline:2px solid #fff; outline-offset:3px; }
  </style>
</head>
<body>
  <div class="caixa">
    <p class="placar">404</p>
    <h1>Bola fora</h1>
    <p>Essa página não existe — ou existia e saiu de quadra. Volta pro início que o jogo continua lá.</p>
    <a href="/basquete-carioca/">Voltar para o início</a>
  </div>
</body>
</html>
